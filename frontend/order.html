<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>提交订单 - 悦翔电竞</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav-container"></div>
<div class="main-content">
    <div class="form-card" style="max-width:500px;">
        <div class="form-title">提交订单</div>

        <div class="form-group">
            <label>购买商品</label>
            <input type="text" class="form-input" id="order-product" readonly>
        </div>

        <div class="form-group">
            <label>上传付款截图</label>
            <div class="file-upload-area" onclick="document.getElementById('screenshot-input').click()" id="upload-area">
                点击选择图片
            </div>
            <input type="file" id="screenshot-input" accept="image/*" style="display:none;" onchange="previewScreenshot(this)">
            <img id="screenshot-preview" class="file-preview hidden" alt="预览">
        </div>

        <div class="form-group">
            <label>订单号 <button type="button" class="btn btn-small" style="padding:2px 8px;font-size:12px;vertical-align:middle;" onclick="showOrderNoHelp()">? 如何获取</button></label>
            <input type="text" class="form-input" id="order-no" placeholder="输入订单号" autocomplete="off">
        </div>

        <div class="form-group">
            <label>游戏ID</label>
            <input type="text" class="form-input" id="game-id" placeholder="输入游戏ID" autocomplete="off">
        </div>

        <div class="form-group">
            <label>区服</label>
            <select class="form-input" id="server-area">
                <option value="微信区">微信区</option>
                <option value="QQ区">QQ区</option>
            </select>
        </div>

        <div class="form-group">
            <label>联系方式</label>
            <div class="contact-row" id="contact-row">
                <select class="form-input contact-type" id="contact-type" onchange="onContactTypeChange()">
                    <option value="">请选择</option>
                    <option value="wechat">微信</option>
                    <option value="qq">QQ</option>
                    <option value="phone">手机号</option>
                </select>
                <input type="text" class="form-input contact-value" id="contact-value" placeholder="请先选择左侧类型" disabled autocomplete="off">
            </div>
            <div class="contact-hint" id="contact-hint">先选择联系方式类型，右侧输入框才能填写</div>
        </div>

        <div class="form-group">
            <label>指定打手</label>
            <select class="form-input" id="designated-booster">
                <option value="">不指定（系统分配）</option>
            </select>
        </div>

        <div class="form-group">
            <label>留言（可选）</label>
            <textarea class="form-input" id="message" placeholder="输入留言（选填）"></textarea>
        </div>

        <button class="btn btn-primary" style="width:100%;" onclick="submitOrder()">提交订单</button>
    </div>
</div>

<script src="js/common.js"></script>
<script>
var screenshotBase64 = '';

// 联系方式：先选类型再填号码。类型为空时输入框禁用，选中后解锁并换占位文案。
var CONTACT_LABELS = { wechat: '微信', qq: 'QQ', phone: '手机号' };
var CONTACT_PLACEHOLDER = { wechat: '请输入微信号', qq: '请输入QQ号', phone: '请输入手机号' };

function onContactTypeChange() {
    var type = document.getElementById('contact-type').value;
    var valueInput = document.getElementById('contact-value');
    var hint = document.getElementById('contact-hint');
    var row = document.getElementById('contact-row');
    if (!type) {
        valueInput.value = '';
        valueInput.disabled = true;
        valueInput.placeholder = '请先选择左侧类型';
        hint.textContent = '先选择联系方式类型，右侧输入框才能填写';
        row.className = 'contact-row';
        return;
    }
    valueInput.disabled = false;
    valueInput.placeholder = CONTACT_PLACEHOLDER[type] || '请输入联系方式';
    hint.textContent = '打手会通过该' + CONTACT_LABELS[type] + '联系你，请确认填写正确';
    row.className = 'contact-row filled';
}

function previewScreenshot(input) {
    if (!input.files || input.files.length === 0) return;
    var file = input.files[0];
    var reader = new FileReader();
    reader.onload = function (e) {
        screenshotBase64 = e.target.result;
        var img = document.getElementById('screenshot-preview');
        img.src = e.target.result;
        img.className = 'file-preview';
        document.getElementById('upload-area').textContent = '已选择: ' + file.name;
    };
    reader.readAsDataURL(file);
}

function submitOrder() {
    var user = getUser();
    if (!user || !user.token) {
        window.location.href = 'login.html';
        return;
    }

    var productTitle = document.getElementById('order-product').value || sessionStorage.getItem('yx_order_product') || localStorage.getItem('yx_order_product') || '';
    var orderNo = document.getElementById('order-no').value.trim();
    var gameId = document.getElementById('game-id').value.trim();
    var serverArea = document.getElementById('server-area').value;
    var rawMessage = document.getElementById('message').value.trim();
    var designatedBooster = document.getElementById('designated-booster').value;
    var contactType = document.getElementById('contact-type').value;
    var contactValue = document.getElementById('contact-value').value.replace(/\s/g, '');

    if (!productTitle) {
        showToast('请先选择商品', 'error');
        return;
    }
    if (!screenshotBase64) {
        showToast('请上传付款截图', 'error');
        return;
    }
    if (!orderNo) {
        showToast('请填写订单号', 'error');
        return;
    }
    if (!gameId) {
        showToast('请填写游戏ID', 'error');
        return;
    }
    if (!contactType) {
        showToast('请选择联系方式类型', 'error');
        return;
    }
    if (!contactValue) {
        showToast('请填写' + (CONTACT_LABELS[contactType] || '联系方式'), 'error');
        return;
    }
    if (contactType === 'phone' && !/^1\d{10}$/.test(contactValue)) {
        showToast('手机号格式不对，请填 11 位数字', 'error');
        return;
    }
    if (contactType === 'qq' && !/^\d{5,12}$/.test(contactValue)) {
        showToast('QQ号格式不对，请填 5-12 位数字', 'error');
        return;
    }

    // 联系方式放在留言最前面，后台与打手页会把它单独拆出来展示；
    // 原来的留言用「【留言】」标记跟在后面，旧订单没有标记也能正常显示。
    var orderMessage = '【联系方式】' + CONTACT_LABELS[contactType] + ' ' + contactValue;
    if (rawMessage) {
        orderMessage += ' 【留言】' + rawMessage;
    }

    ajaxPost('/api/order/submit', {
        token: user.token,
        product_title: productTitle,
        screenshot: screenshotBase64,
        order_no: orderNo,
        game_id: gameId,
        server_area: serverArea,
        message: orderMessage,
        designated_booster: designatedBooster
    }, function (resp) {
        if (resp.success) {
            showToast(resp.msg || '提交成功', 'success');
            setTimeout(function () {
                window.location.href = 'profile.html';
            }, 1200);
        } else {
            showToast(resp.msg || '提交失败', 'error');
            if (resp.msg === '未登录') {
                setTimeout(function () {
                    window.location.href = 'login.html';
                }, 1000);
            }
        }
    });
}

function showOrderNoHelp() {
    var msg = '=== 订单号获取方法 ===\n\n' +
              '1. 打开微信或支付宝\n' +
              '2. 找到刚才的支付记录\n' +
              '3. 点击详情查看订单号\n' +
              '4. 长按或长按复制订单号\n' +
              '5. 回到本页面粘贴到上方输入框\n\n' +
              '注意：订单号通常是20位左右的数字\n' +
              '如：20250820123456789012';
    alert(msg);
}

initPage(function () {
    if (!requireLogin()) return;
    var product = sessionStorage.getItem('yx_order_product') || localStorage.getItem('yx_order_product') || '';
    document.getElementById('order-product').value = product;
    // Load booster list for selection
    ajaxGet('/api/boosters', function (resp) {
        if (resp.success && resp.boosters.length > 0) {
            var sel = document.getElementById('designated-booster');
            for (var i = 0; i < resp.boosters.length; i++) {
                var opt = document.createElement('option');
                opt.value = resp.boosters[i].name;
                opt.textContent = resp.boosters[i].name;
                sel.appendChild(opt);
            }
        }
    });
});
</script>
</body>
</html>
