<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>登录 - 悦翔电竞</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav-container"></div>
<div class="main-content">
    <div class="form-card">
        <!-- Login Form -->
        <div id="login-form">
            <div class="form-title">登录</div>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" class="form-input" id="login-username" placeholder="输入用户名" autocomplete="off">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" class="form-input" id="login-password" placeholder="输入密码" autocomplete="off">
            </div>
            <div id="captcha-container"></div>
            <button class="btn btn-primary" style="width:100%;" onclick="doLogin()">登录</button>
            <div class="form-hint">
                <a onclick="showRegister()">没有账户？点此注册</a>
                <span style="margin:0 8px;color:#2a2a3e;">|</span>
                <a onclick="showForgot()">忘记密码</a>
            </div>
        </div>

        <!-- Register Form -->
        <div id="register-form" class="hidden">
            <div class="form-title">注册</div>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" class="form-input" id="reg-username" placeholder="输入用户名" autocomplete="off">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" class="form-input" id="reg-password" placeholder="输入密码" autocomplete="off">
            </div>
            <div id="captcha-container-reg"></div>
            <button class="btn btn-primary" style="width:100%;" onclick="doRegister()">注册</button>
            <div class="form-hint">
                <a onclick="showLogin()">已有账户？点此登录</a>
            </div>
        </div>
    </div>
</div>

<script src="js/common.js"></script>
<script src="js/captcha.js"></script>
<script>
function showLogin() {
    document.getElementById('login-form').className = '';
    document.getElementById('register-form').className = 'hidden';
    CaptchaManager.load('captcha-container');
}
function showRegister() {
    document.getElementById('login-form').className = 'hidden';
    document.getElementById('register-form').className = '';
    CaptchaManager.load('captcha-container-reg');
}
function showForgot() {
    showModal('提示', '<p style="color:#94a3b8;text-align:center;padding:20px 0;">请联系管理员找回密码</p>');
}

function doLogin() {
    var username = document.getElementById('login-username').value.trim();
    var password = document.getElementById('login-password').value.trim();
    if (!username || !password) {
        showToast('请填写用户名和密码', 'error');
        return;
    }
    var captchaAnswer = CaptchaManager.getAnswerFor('captcha-container');
    var captchaSession = CaptchaManager.getSessionIdFor('captcha-container');
    if (!captchaAnswer) {
        showToast('请完成验证', 'error');
        return;
    }
    ajaxPost('/api/login', {
        username: username,
        password: password,
        captcha_session: captchaSession,
        captcha_answer: captchaAnswer
    }, function (resp) {
        if (resp.success) {
            setUser(resp.user);
            showToast('登录成功', 'success');
            setTimeout(function () {
                window.location.href = 'index.html';
            }, 800);
        } else {
            showToast(resp.msg || '验证失败', 'error');
            CaptchaManager.load('captcha-container');
        }
    });
}

function doRegister() {
    var username = document.getElementById('reg-username').value.trim();
    var password = document.getElementById('reg-password').value.trim();
    if (!username || !password) {
        showToast('用户名和密码不能为空', 'error');
        return;
    }
    var captchaAnswer = CaptchaManager.getAnswerFor('captcha-container-reg');
    var captchaSession = CaptchaManager.getSessionIdFor('captcha-container-reg');
    if (!captchaAnswer) {
        showToast('请完成验证', 'error');
        return;
    }
    ajaxPost('/api/register', {
        username: username,
        password: password,
        captcha_session: captchaSession,
        captcha_answer: captchaAnswer
    }, function (resp) {
        if (resp.success) {
            showToast('注册成功，请登录', 'success');
            showLogin();
        } else {
            showToast(resp.msg || '验证失败', 'error');
            CaptchaManager.load('captcha-container-reg');
        }
    });
}

initPage(function () {
    CaptchaManager.load('captcha-container');
});
</script>
</body>
</html>
