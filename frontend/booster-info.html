<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>打手介绍 - 悦翔电竞</title>
<link rel="stylesheet" href="css/style.css">
<style>
.booster-card {
    background: #1a1a2e;
    border: 1px solid #2a2a3e;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
}
.booster-card .booster-name {
    font-size: 18px;
    color: #a855f7;
    margin-bottom: 8px;
    font-weight: bold;
}
.booster-card .booster-info-row {
    display: flex;
    margin-bottom: 6px;
    font-size: 14px;
}
.booster-card .booster-label {
    color: #64748b;
    min-width: 80px;
}
.booster-card .booster-value {
    color: #e2e8f0;
    flex: 1;
}
.booster-card .booster-intro {
    color: #94a3b8;
    font-size: 13px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #2a2a3e;
    line-height: 1.6;
}
</style>
</head>
<body>
<div id="nav-container"></div>
<div class="main-content">
    <div class="form-title" style="margin-bottom:20px;">打手介绍</div>
    <div id="booster-list"><p style="color:#64748b;text-align:center;padding:20px;">加载中...</p></div>
</div>

<script src="js/common.js"></script>
<script>
// 打手数据来自本地静态文件 data/boosters.json（纯数组），不依赖任何后端接口。
// 兼容两种写法：纯数组 [ {...} ]，或 { success: true, boosters: [ {...} ] }。
function pickBoosterList(resp) {
    if (!resp) return [];
    if (Object.prototype.toString.call(resp) === '[object Array]') return resp;
    if (resp.boosters && resp.boosters.length !== undefined) return resp.boosters;
    return [];
}

function boosterInfoRow(label, value) {
    if (!value) return '';
    return '<div class="booster-info-row"><span class="booster-label">' + label +
        '</span><span class="booster-value">' + escapeHtml(value) + '</span></div>';
}

function boosterPlaceholder(text) {
    return '<p style="color:#64748b;text-align:center;padding:20px;">' + text + '</p>';
}

function loadBoosters() {
    ajaxGet('data/boosters.json', function (resp) {
        var div = document.getElementById('booster-list');
        if (!resp || resp.success === false) {
            div.innerHTML = boosterPlaceholder('打手信息加载失败');
            return;
        }
        var list = pickBoosterList(resp);
        if (list.length === 0) {
            div.innerHTML = boosterPlaceholder('暂无打手信息');
            return;
        }
        var html = '';
        for (var i = 0; i < list.length; i++) {
            var b = list[i];
            html += '<div class="booster-card">';
            html += '<div class="booster-name">' + escapeHtml(b.nickname || b.name || '') + '</div>';
            html += boosterInfoRow('段位', b.level || b.rank);
            html += boosterInfoRow('擅长游戏', b.specialty);
            var intro = b.introduction || b.intro;
            if (intro) {
                html += '<div class="booster-intro">' + escapeHtml(intro) + '</div>';
            }
            html += '</div>';
        }
        div.innerHTML = html;
    });
}

initPage(function () {
    loadBoosters();
});
</script>
</body>
</html>
