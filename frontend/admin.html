<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>管理员后台 - 悦翔电竞</title>
<link rel="stylesheet" href="css/style.css">
<style>
.admin-tab-bar {
    display: flex;
    gap: 0;
    margin-bottom: 20px;
    border-bottom: 2px solid #2a2a3e;
    flex-wrap: wrap;
}
.admin-tab {
    padding: 10px 24px;
    color: #64748b;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    font-size: 15px;
    white-space: nowrap;
}
.admin-tab.active {
    color: #a855f7;
    border-bottom-color: #a855f7;
}
.admin-empty {
    text-align: center;
    color: #64748b;
    padding: 20px;
}
.admin-empty-error {
    color: #ef4444;
}
.admin-notice {
    margin: 0 0 16px;
    padding: 12px 14px;
    border-radius: 8px;
    background: #3a2a12;
    border: 1px solid #a16207;
    color: #fde68a;
    font-size: 13px;
    line-height: 1.6;
}
</style>
</head>
<body>
<div id="nav-container"></div>
<div class="main-content">
    <div id="admin-content">
        <div id="admin-notice" class="hidden"></div>
        <div class="admin-tab-bar">
            <div class="admin-tab active" onclick="switchTab('orders')" id="tab-orders">订单管理</div>
            <div class="admin-tab" onclick="switchTab('reports')" id="tab-reports">举报管理</div>
            <div class="admin-tab" onclick="switchTab('users')" id="tab-users">用户管理</div>
            <div class="admin-tab" onclick="switchTab('reviews')" id="tab-reviews">评价管理</div>
            <div class="admin-tab" onclick="switchTab('applications')" id="tab-applications">报名管理</div>
        </div>

        <!-- Orders Tab -->
        <div id="section-orders">
            <div class="admin-section">
                <div class="admin-section-title">订单列表 <button class="btn btn-secondary btn-small" onclick="loadOrders()" style="float:right;">刷新</button></div>
                <table class="admin-table">
                    <thead><tr><th>ID</th><th>用户</th><th>联系方式</th><th>商品</th><th>订单号</th><th>游戏ID</th><th>区服</th><th>指定打手</th><th>状态</th><th>时间</th><th>付款截图</th><th>操作</th></tr></thead>
                    <tbody id="order-tbody"></tbody>
                </table>
            </div>
        </div>

        <!-- Reports Tab -->
        <div id="section-reports" class="hidden">
            <div class="admin-section">
                <div class="admin-section-title">举报列表 <button class="btn btn-secondary btn-small" onclick="loadReports()" style="float:right;">刷新</button></div>
                <table class="admin-table">
                    <thead><tr><th>ID</th><th>举报人</th><th>被举报人</th><th>原因</th><th>时间</th><th>状态</th><th>操作</th></tr></thead>
                    <tbody id="report-tbody"></tbody>
                </table>
            </div>
        </div>

        <!-- Users Tab -->
        <div id="section-users" class="hidden">
            <div class="admin-section">
                <div class="admin-section-title">用户列表 <button class="btn btn-secondary btn-small" onclick="loadUsers()" style="float:right;">刷新</button></div>
                <table class="admin-table">
                    <thead><tr><th>UID</th><th>用户名</th><th>等级</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead>
                    <tbody id="user-tbody"></tbody>
                </table>
            </div>
        </div>

        <!-- Reviews Tab -->
        <div id="section-reviews" class="hidden">
            <div class="admin-section">
                <div class="admin-section-title">评价列表 <button class="btn btn-secondary btn-small" onclick="loadReviews()" style="float:right;">刷新</button></div>
                <table class="admin-table">
                    <thead><tr><th>ID</th><th>订单号</th><th>评价人</th><th>打手</th><th>评分</th><th>评价内容</th><th>时间</th></tr></thead>
                    <tbody id="review-tbody"></tbody>
                </table>
            </div>
        </div>
        <!-- Applications Tab -->
        <div id="section-applications" class="hidden">
            <div class="admin-section">
                <div class="admin-section-title">报名列表 <button class="btn btn-secondary btn-small" onclick="loadApplications()" style="float:right;">刷新</button></div>
                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead><tr><th>ID</th><th>用户名</th><th>游戏ID</th><th>区服</th><th>段位</th><th>擅长模式</th><th>联系方式</th><th>在线时间</th><th>自我介绍</th><th>状态</th><th>操作</th></tr></thead>
                        <tbody id="application-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/common.js"></script>
<script>
var currentTab = 'orders';

// 订单号 → 付款截图 key（用户名可能带引号，不能拼进 onclick 属性）
var shotKeys = {};

// 表格空态/错误态：以前失败时直接清空 tbody，管理员看到一片空白，分不清「没数据」还是「坏了」。
function setTableState(tbody, cols, msg, isError) {
    tbody.innerHTML = '<tr><td colspan="' + cols + '" class="admin-empty' + (isError ? ' admin-empty-error' : '') + '">' + escapeHtml(msg) + '</td></tr>';
}

function getAdminToken() {
    var user = getUser();
    return user ? user.token : '';
}

function checkAdminAccess(callback) {
    // 登录态不在加载期校验，也不做轮询；权限由写操作接口在服务端验一次
    var token = getAdminToken();
    if (!token) {
        window.location.href = 'index.html';
        return;
    }
    if (callback) callback();
}

function switchTab(tab) {
    currentTab = tab;
    var sections = ['orders', 'reports', 'users', 'reviews', 'applications'];
    for (var i = 0; i < sections.length; i++) {
        var el = document.getElementById('section-' + sections[i]);
        var tabEl = document.getElementById('tab-' + sections[i]);
        if (sections[i] === tab) {
            el.className = '';
            tabEl.className = 'admin-tab active';
        } else {
            el.className = 'hidden';
            tabEl.className = 'admin-tab';
        }
    }
}

// ==================== Orders ====================
function loadOrders() {
    shotKeys = {};
    ajaxGet('/api/admin/orders', function (resp) {
        var tbody = document.getElementById('order-tbody');
        if (!resp.success) { setTableState(tbody, 12, resp.msg || '订单加载失败', true); showToast(resp.msg || '订单加载失败', 'error'); return; }
        if (!resp.orders.length) { setTableState(tbody, 12, '暂无订单', false); return; }
        var html = '';
        for (var i = 0; i < resp.orders.length; i++) {
            var o = resp.orders[i];
            shotKeys[o.id] = o.screenshot_key || '';
            var cm = splitOrderMessage(o.message);
            var statusText, statusColor;
            if (o.status === 'verified') {
                statusText = '已通过';
                statusColor = '#22c55e';
            } else if (o.status === 'rejected') {
                statusText = '已驳回';
                statusColor = '#ef4444';
            } else if (o.status === 'accepted') {
                statusText = '进行中';
                statusColor = '#f59e0b';
            } else if (o.status === 'completed') {
                statusText = '已完成';
                statusColor = '#22c55e';
            } else {
                statusText = '待核对';
                statusColor = '#f59e0b';
            }
            html += '<tr><td>' + o.id + '</td><td>' + escapeHtml(o.username) + '</td><td>' + escapeHtml(cm.contact || '-') + '</td><td>' + escapeHtml(o.product_title || '') + '</td>';
            html += '<td>' + escapeHtml(o.order_no || '') + '</td><td>' + escapeHtml(o.game_id || '') + '</td><td>' + escapeHtml(o.server_area || '') + '</td>';
            html += '<td>' + escapeHtml(o.designated_booster || '-') + '</td>';
            html += '<td style="color:' + statusColor + ';">' + statusText;
            if (o.status === 'rejected' && o.reject_reason) {
                html += '<br><span style="font-size:11px;color:#94a3b8;">(' + escapeHtml(o.reject_reason) + ')</span>';
            }
            if (o.accepted_booster) {
                html += '<br><span style="font-size:11px;color:#a855f7;">打手:' + escapeHtml(o.accepted_booster) + '</span>';
            }
            html += '</td>';
            html += '<td>' + (o.submit_time || '') + '</td>';
            html += '<td>';
            if (o.screenshot_key) {
                html += '<button class="btn btn-secondary admin-action-btn" onclick="viewShot(' + o.id + ')">查看</button>';
            } else {
                html += '<span class="admin-shot-none">无</span>';
            }
            html += '</td>';
            html += '<td>';
            if (o.status === 'pending') {
                html += '<button class="btn btn-success admin-action-btn" onclick="verifyOrder(' + o.id + ')">通过</button>';
                html += '<button class="btn btn-danger admin-action-btn" onclick="rejectOrder(' + o.id + ')">驳回</button>';
            }
            html += '<button class="btn btn-danger admin-action-btn" onclick="deleteOrder(' + o.id + ')">删除</button>';
            html += '</td>';
            html += '</tr>';
        }
        tbody.innerHTML = html;
    });
}

function verifyOrder(id) {
    ajaxPost('/api/admin/order/verify', { token: getAdminToken(), id: id }, function (resp) {
        if (resp.success) {
            showToast('已通过', 'success');
            loadOrders();
        }
    });
}

function rejectOrder(id) {
    var reason = prompt('请输入驳回理由：', '支付信息不实');
    if (reason === null) return;
    reason = reason.trim();
    if (!reason) reason = '支付信息不实';
    ajaxPost('/api/admin/order/reject', { token: getAdminToken(), id: id, reason: reason }, function (resp) {
        if (resp.success) {
            showToast('已驳回', 'success');
            loadOrders();
        } else {
            showToast(resp.msg || '操作失败', 'error');
        }
    });
}

function deleteOrder(id) {
    if (!confirm('确定删除该订单？删除后不可恢复')) return;
    ajaxPost('/api/admin/order/delete', { token: getAdminToken(), id: id }, function (resp) {
        if (resp.success) {
            showToast('已删除', 'success');
            loadOrders();
        } else {
            showToast(resp.msg || '删除失败', 'error');
        }
    });
}

// ==================== 付款截图 ====================
// 订单号 → 截图 key。用户名可能带引号，key 不拼进 onclick 属性，按钮只传订单号。
var shotObjectUrl = '';

function revokeShotUrl() {
    if (shotObjectUrl) {
        try { URL.revokeObjectURL(shotObjectUrl); } catch (e) {}
        shotObjectUrl = '';
    }
}

function viewShot(id) {
    var key = shotKeys[id];
    if (!key) { showToast('该订单没有付款截图', 'error'); return; }
    revokeShotUrl();
    showModal('付款截图', '<div class="shot-box" id="shot-box"><div class="shot-tip">加载中…</div></div>', 'shot-modal');
    fetchShot(key, function (url, msg) {
        var box = document.getElementById('shot-box');
        if (!box) { if (url) { try { URL.revokeObjectURL(url); } catch (e) {} } return; }
        if (!url) { box.innerHTML = '<div class="shot-tip shot-error">' + escapeHtml(msg) + '</div>'; return; }
        shotObjectUrl = url;
        box.innerHTML = '<img class="shot-img" alt="付款截图" src="' + url + '">';
    });
}

// 截图是带鉴权的二进制：用 XHR 带 Authorization 头取回，再转成本地 blob 地址给 <img> 显示。
// token 不放 URL（会进浏览器历史与日志），接口本身也不接受匿名访问。
function fetchShot(key, done) {
    var user = getUser();
    var xhr = new XMLHttpRequest();
    xhr.open('GET', API_BASE + '/api/admin/shot?key=' + encodeURIComponent(key), true);
    if (user && user.token) xhr.setRequestHeader('Authorization', 'Bearer ' + user.token);
    xhr.responseType = 'blob';
    xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        if (xhr.status === 200 && xhr.response) {
            done(URL.createObjectURL(xhr.response), '');
            return;
        }
        readBlobText(xhr.response, function (text) {
            var msg = xhr.status === 403 ? '无权限：请用管理员账号登录' : '截图加载失败';
            try {
                var j = JSON.parse(text);
                if (j && j.msg) msg = j.msg;
            } catch (e) {}
            done('', msg);
        });
    };
    xhr.send();
}

// responseType 是 blob 时读不到 responseText，失败响应体（接口返回的 JSON）只能经 FileReader 取。
function readBlobText(blob, cb) {
    if (!blob) { cb(''); return; }
    try {
        var fr = new FileReader();
        fr.onload = function () { cb(String(fr.result || '')); };
        fr.onerror = function () { cb(''); };
        fr.readAsText(blob);
    } catch (e) { cb(''); }
}

// ==================== Reports ====================
function loadReports() {
    ajaxGet('/api/admin/reports', function (resp) {
        var tbody = document.getElementById('report-tbody');
        if (!resp.success) { setTableState(tbody, 7, resp.msg || '举报加载失败', true); showToast(resp.msg || '举报加载失败', 'error'); return; }
        if (!resp.reports.length) { setTableState(tbody, 7, '暂无举报', false); return; }
        var html = '';
        for (var i = 0; i < resp.reports.length; i++) {
            var r = resp.reports[i];
            var statusText, statusColor;
            if (r.status === 'handled') {
                statusText = '已处理';
                statusColor = '#22c55e';
            } else if (r.status === 'rejected') {
                statusText = '不通过';
                statusColor = '#ef4444';
            } else {
                statusText = '待处理';
                statusColor = '#f59e0b';
            }
            html += '<tr><td>' + r.id + '</td><td>' + escapeHtml(r.reporter_name) + '</td><td>' + escapeHtml(r.target_id) + '</td>';
            html += '<td>' + escapeHtml(r.reason) + '</td><td>' + escapeHtml(r.submit_time) + '</td><td style="color:' + statusColor + ';">' + statusText;
            if (r.status === 'rejected' && r.reject_reason) {
                html += '<br><span style="font-size:11px;color:#94a3b8;">(' + escapeHtml(r.reject_reason) + ')</span>';
            }
            html += '</td>';
            html += '<td>';
            if (r.status === 'pending') {
                html += '<button class="btn btn-danger admin-action-btn" onclick="banReported(' + r.id + ',\'' + r.target_id + '\')">封禁</button>';
                html += '<button class="btn btn-success admin-action-btn" onclick="handleReport(' + r.id + ')">通过</button>';
                html += '<button class="btn btn-secondary admin-action-btn" onclick="rejectReport(' + r.id + ')">不通过</button>';
            }
            html += '<button class="btn btn-danger admin-action-btn" onclick="deleteReport(' + r.id + ')">删除</button>';
            html += '</td>';
            html += '</tr>';
        }
        tbody.innerHTML = html;
    });
}

function banReported(id, targetId) {
    if (!confirm('确定封禁用户 ' + targetId + ' ?')) return;
    ajaxPost('/api/admin/report/handle', {
        token: getAdminToken(),
        id: id,
        ban: true,
        target_id: targetId
    }, function (resp) {
        if (resp.success) {
            showToast('已封禁并处理', 'success');
            loadReports();
        }
    });
}

function handleReport(id) {
    ajaxPost('/api/admin/report/handle', { token: getAdminToken(), id: id, ban: false }, function (resp) {
        if (resp.success) {
            showToast('已通过', 'success');
            loadReports();
        }
    });
}

function rejectReport(id) {
    var reason = prompt('请输入不通过原因：', '举报不实');
    if (reason === null) return;
    reason = reason.trim();
    if (!reason) reason = '举报不实';
    ajaxPost('/api/admin/report/reject', { token: getAdminToken(), id: id, reason: reason }, function (resp) {
        if (resp.success) {
            showToast('已驳回', 'success');
            loadReports();
        } else {
            showToast(resp.msg || '操作失败', 'error');
        }
    });
}

function deleteReport(id) {
    if (!confirm('确定删除该举报记录？删除后不可恢复')) return;
    ajaxPost('/api/admin/report/delete', { token: getAdminToken(), id: id }, function (resp) {
        if (resp.success) {
            showToast('已删除', 'success');
            loadReports();
        } else {
            showToast(resp.msg || '删除失败', 'error');
        }
    });
}

// ==================== Users ====================
function loadUsers() {
    ajaxGet('/api/admin/users', function (resp) {
        var tbody = document.getElementById('user-tbody');
        if (!resp.success) { setTableState(tbody, 6, resp.msg || '用户加载失败', true); showToast(resp.msg || '用户加载失败', 'error'); return; }
        if (!resp.users.length) { setTableState(tbody, 6, '暂无用户', false); return; }
        var html = '';
        for (var i = 0; i < resp.users.length; i++) {
            var u = resp.users[i];
            var levelText;
            if (u.op_level === 3) {
                levelText = '管理员(3)';
            } else if (u.op_level === 2) {
                levelText = '打手(2)';
            } else {
                levelText = '普通(1)';
            }
            var statusText = u.status === 'yes' ? '正常' : '封禁';
            html += '<tr><td>' + escapeHtml(u.uid) + '</td><td>' + escapeHtml(u.user) + '</td><td>' + levelText + '</td><td>' + statusText + '</td><td>' + escapeHtml(u.reg_time) + '</td>';
            html += '<td>';
            if (u.status === 'yes') {
                html += '<button class="btn btn-danger admin-action-btn" onclick="banUser(\'' + u.uid + '\')">封禁</button>';
            } else {
                html += '<button class="btn btn-success admin-action-btn" onclick="unbanUser(\'' + u.uid + '\')">解封</button>';
            }
            if (u.op_level < 2) {
                html += '<button class="btn btn-primary admin-action-btn" onclick="setBooster(\'' + u.uid + '\')">设打手</button>';
            } else if (u.op_level === 2) {
                html += '<button class="btn btn-secondary admin-action-btn" onclick="revokeBooster(\'' + u.uid + '\')">撤销打手</button>';
            }
            html += '<button class="btn btn-secondary admin-action-btn" onclick="resetPwd(\'' + u.uid + '\')">重置密码</button>';
            html += '<button class="btn btn-danger admin-action-btn" onclick="deleteUser(\'' + u.uid + '\')">删除</button>';
            html += '</td></tr>';
        }
        tbody.innerHTML = html;
    });
}

function banUser(uid) {
    ajaxPost('/api/admin/user/ban', { token: getAdminToken(), uid: uid }, function (resp) {
        if (resp.success) { showToast('已封禁', 'success'); loadUsers(); }
    });
}
function unbanUser(uid) {
    ajaxPost('/api/admin/user/unban', { token: getAdminToken(), uid: uid }, function (resp) {
        if (resp.success) { showToast('已解封', 'success'); loadUsers(); }
    });
}
function setBooster(uid) {
    if (!confirm('确定设为打手?')) return;
    ajaxPost('/api/admin/user/set_admin', { token: getAdminToken(), uid: uid, op_level: 2 }, function (resp) {
        if (resp.success) { showToast('已设为打手', 'success'); loadUsers(); }
        else showToast(resp.msg || '失败', 'error');
    });
}
function revokeBooster(uid) {
    if (!confirm('确定撤销该打手身份(降为普通用户)?')) return;
    ajaxPost('/api/admin/user/revoke_admin', { token: getAdminToken(), uid: uid }, function (resp) {
        if (resp.success) { showToast('已撤销打手身份', 'success'); loadUsers(); }
        else showToast(resp.msg || '失败', 'error');
    });
}
function resetPwd(uid) {
    if (!confirm('确定重置该用户的密码? 将生成随机临时密码。')) return;
    ajaxPost('/api/admin/user/reset_password', { token: getAdminToken(), uid: uid }, function (resp) {
        if (resp.success) { showToast(resp.msg || '已重置', 'success'); loadUsers(); }
    });
}
function deleteUser(uid) {
    if (!confirm('确定删除该用户?')) return;
    ajaxPost('/api/admin/user/delete', { token: getAdminToken(), uid: uid }, function (resp) {
        if (resp.success) { showToast('已删除', 'success'); loadUsers(); }
        else showToast(resp.msg || '失败', 'error');
    });
}

// ==================== Reviews ====================
function loadReviews() {
    ajaxGet('/api/admin/reviews', function (resp) {
        var tbody = document.getElementById('review-tbody');
        if (!resp.success) { setTableState(tbody, 7, resp.msg || '评价加载失败', true); showToast(resp.msg || '评价加载失败', 'error'); return; }
        var reviews = resp.reviews || [];
        if (!reviews.length) { setTableState(tbody, 7, '暂无评价', false); return; }
        var html = '';
        for (var i = 0; i < reviews.length; i++) {
            var rv = reviews[i];
            var starsHtml = '';
            for (var s = 0; s < 5; s++) {
                if (s < rv.stars) {
                    starsHtml += '<span style="color:#fbbf24;">&#9733;</span>';
                } else {
                    starsHtml += '<span style="color:#2a2a3e;">&#9733;</span>';
                }
            }
            html += '<tr><td>' + rv.id + '</td><td>#' + rv.order_id + '</td><td>' + escapeHtml(rv.reviewer_name) + '</td><td>' + escapeHtml(rv.booster_name) + '</td>';
            html += '<td>' + starsHtml + ' (' + rv.stars + '星)</td>';
            html += '<td>' + escapeHtml(rv.comment || '-') + '</td><td>' + escapeHtml(rv.review_time || '') + '</td></tr>';
        }
        if (reviews.length === 0) {
            html = '<tr><td colspan="7" style="text-align:center;color:#64748b;padding:20px;">暂无评价</td></tr>';
        }
        tbody.innerHTML = html;
    });
}

// ==================== Applications ====================
function loadApplications() {
    ajaxGet('/api/admin/applications', function (resp) {
        var tbody = document.getElementById('application-tbody');
        if (!resp.success) { setTableState(tbody, 11, resp.msg || '报名加载失败', true); showToast(resp.msg || '报名加载失败', 'error'); return; }
        var list = resp.applications || [];
        if (!list.length) { setTableState(tbody, 11, '暂无报名', false); return; }
        var html = '';
        for (var i = 0; i < list.length; i++) {
            var a = list[i];
            var statusText, statusColor;
            if (a.status === 'approved') {
                statusText = '已通过';
                statusColor = '#22c55e';
            } else if (a.status === 'rejected') {
                statusText = '已拒绝';
                statusColor = '#ef4444';
            } else {
                statusText = '待审核';
                statusColor = '#f59e0b';
            }
            html += '<tr><td>' + a.id + '</td><td>' + escapeHtml(a.username) + '</td><td>' + escapeHtml(a.game_id || '') + '</td>';
            html += '<td>' + escapeHtml(a.server_area || '') + '</td><td>' + escapeHtml(a.game_rank || '') + '</td>';
            html += '<td>' + escapeHtml(a.specialty || '-') + '</td><td>' + escapeHtml(a.contact || '-') + '</td>';
            html += '<td>' + escapeHtml(a.online_time || '-') + '</td><td>' + escapeHtml(a.intro || '-') + '</td>';
            html += '<td style="color:' + statusColor + ';">' + statusText;
            if (a.status === 'rejected' && a.reject_reason) {
                html += '<br><span style="font-size:11px;color:#94a3b8;">(' + escapeHtml(a.reject_reason) + ')</span>';
            }
            html += '</td><td>';
            if (a.status !== 'approved') {
                html += '<button class="btn btn-success admin-action-btn" onclick="approveApplication(' + a.id + ')">通过</button>';
            }
            if (a.status !== 'rejected') {
                html += '<button class="btn btn-secondary admin-action-btn" onclick="rejectApplication(' + a.id + ')">拒绝</button>';
            }
            html += '<button class="btn btn-danger admin-action-btn" onclick="deleteApplication(' + a.id + ')">删除</button>';
            html += '</td></tr>';
        }
        tbody.innerHTML = html;
    });
}

function approveApplication(id) {
    ajaxPost('/api/admin/application/approve', { token: getAdminToken(), id: id }, function (resp) {
        if (resp.success) { showToast('已通过', 'success'); loadApplications(); }
        else { showToast(resp.msg || '操作失败', 'error'); }
    });
}

function rejectApplication(id) {
    var reason = prompt('请输入拒绝理由：', '您不符合我们招收标准');
    if (reason === null) return;
    reason = reason.trim();
    if (!reason) reason = '您不符合我们招收标准';
    if (!confirm('确定拒绝该报名？\n拒绝理由：' + reason)) return;
    ajaxPost('/api/admin/application/reject', { token: getAdminToken(), id: id, reason: reason }, function (resp) {
        if (resp.success) { showToast('已拒绝', 'success'); loadApplications(); }
        else { showToast(resp.msg || '操作失败', 'error'); }
    });
}

function deleteApplication(id) {
    if (!confirm('确定删除该报名记录？删除后不可恢复')) return;
    ajaxPost('/api/admin/application/delete', { token: getAdminToken(), id: id }, function (resp) {
        if (resp.success) { showToast('已删除', 'success'); loadApplications(); }
        else { showToast(resp.msg || '删除失败', 'error'); }
    });
}

// ==================== Init ====================
initPage(function () {
    checkAdminAccess(function () {
        // 权限提示：非管理员账号进后台时，服务端对各列表都判 403，看起来像「页面坏了」。
        var me = getUser();
        var lvl = me && me.op_level ? Number(me.op_level) : 0;
        if (lvl < 3) {
            var notice = document.getElementById('admin-notice');
            if (notice) {
                notice.className = 'admin-notice';
                notice.innerHTML = '当前账号「' + escapeHtml(me && me.username ? me.username : '未登录') + '」不是管理员，'
                    + '下面的订单/用户等列表都会显示「无权限」。请改用管理员账号登录；'
                    + '若还没有管理员账号，运行项目里的「生成管理员账户.bat」生成一个。';
            }
        }
        loadOrders();
        loadReports();
        loadUsers();
        loadReviews();
        loadApplications();
    });
});
</script>
